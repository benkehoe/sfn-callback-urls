Transform: 'AWS::Serverless-2016-10-31'
Metadata:
  AWS::ServerlessRepo::Application:
    Name: sfn-callback-urls
    SemanticVersion: 2.0.0
    Description: Easy handling of Step Function tokens as callback URLs
    Author: Ben Kehoe
    Labels:
      - stepfunctions
      - callback
      - email
    SpdxLicenseId: Apache-2.0
    LicenseUrl: LICENSE
    ReadmeUrl: README.md
    HomePageUrl: https://github.com/benkehoe/sfn-callback-urls
    SourceCodeUrl: https://github.com/benkehoe/sfn-callback-urls
  cfn-lint:
    config:
      ignore_checks:
      - E3510 # KMS key ARN default value of "NONE" (intentionally not a valid ARN) causes this error
Globals:
  Function:
    Runtime: python3.12
    MemorySize: 1024
Parameters:
  DisableEncryption:
    Description: Disable encryption for callback payloads
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "false"
  EncryptionKeyArn:
    Description: If encryption is enabled, set this to use your own KMS key, or set to NONE to create one
    Type: String
    Default: 'NONE'
  EnableOutputParameters:
    Description: Allow the use of query parameters to customize the result of callbacks
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "false"
  EnablePostActions:
    Description: Allow the use of post actions, which pass the callback request body to Step Functions
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "false"
  EnableSnapStart:
    Description: Use Lambda SnapStart to reduce cold start time
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "false"
  VerboseLogging:
    Description: Log requests and payloads
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "false"
Conditions:
  EncryptionEnabled:
    Fn::Equals: [ !Ref DisableEncryption, "false" ]
  CreateKey:
    Fn::And:
      - Fn::Equals: [ !Ref DisableEncryption, "false" ]
      - Fn::Equals: [ !Ref EncryptionKeyArn, "NONE" ]
  OutputParametersDisabled:
    Fn::Equals: [ !Ref EnableOutputParameters, "false" ]
  PostActionsDisabled:
    Fn::Equals: [ !Ref EnablePostActions, "false" ]
  SnapStartEnabled:
    Fn::Equals: [ !Ref EnableSnapStart, "true" ]
  SnapStartNotEnabled:
    !Not [ !Condition SnapStartEnabled ]
  VerboseLoggingEnabled:
    Fn::Equals: [ !Ref VerboseLogging, "true" ]
Outputs:
  Api:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${ApiStage}"
  Function:
    Value: !Ref CreateUrlsFunctionAlias
  Policy:
    Value: !Ref CreateUrlsPolicy
Resources:
  CreateUrlsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Permission to call the API and the function directly
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: execute-api:Invoke
            Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/${ApiStage}/*
          - Effect: Allow
            Action: lambda:Invoke
            Resource: !GetAtt CreateUrlsFunction.Arn
          - Effect: Allow
            Action: lambda:Invoke
            Resource: !Ref CreateUrlsFunctionAlias

  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: Callback URLs service for Step Functions
      EndpointConfiguration:
        Types:
        - REGIONAL

  CreateUrlsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt Api.RootResourceId
      PathPart: urls
      RestApiId: !Ref Api

  CreateUrlsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: POST
      ResourceId: !Ref CreateUrlsResource
      RestApiId: !Ref Api
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          !Join
            - ""
            - - !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/"
              - !If
                - SnapStartEnabled
                - !Ref CreateUrlsForApiFunctionVersion
                - !GetAtt CreateUrlsForApiFunction.Arn
              - "/invocations"

  CreateUrlsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        !If
          - SnapStartEnabled
          - !Ref CreateUrlsForApiFunctionVersion
          - !GetAtt CreateUrlsForApiFunction.Arn
      Action: "lambda:InvokeFunction"
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/*"

  ProcessCallbackResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt Api.RootResourceId
      PathPart: respond
      RestApiId: !Ref Api

  ProcessCallbackGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: GET
      ResourceId: !Ref ProcessCallbackResource
      RestApiId: !Ref Api
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          !Join
            - ""
            - - !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/"
              - !If
                - SnapStartEnabled
                - !Ref ProcessCallbackFunctionVersion
                - !GetAtt ProcessCallbackFunction.Arn
              - "/invocations"

  ProcessCallbackPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: POST
      ResourceId: !Ref ProcessCallbackResource
      RestApiId: !Ref Api
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: # !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProcessCallbackFunction}/invocations"
          !Join
            - ""
            - - !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/"
              - !If
                - SnapStartEnabled
                - !Ref ProcessCallbackFunctionVersion
                - !GetAtt ProcessCallbackFunction.Arn
              - "/invocations"

  ProcessCallbackInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        !If
          - SnapStartEnabled
          - !Ref ProcessCallbackFunctionVersion
          - !GetAtt ProcessCallbackFunction.Arn
      Action: "lambda:InvokeFunction"
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/*"

  CreateUrlsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }

  CreateUrlsLogsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      Roles:
      - !Ref CreateUrlsRole
      PolicyName: LambdaLogging
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - "logs:CreateLogStream"
              - "logs:CreateLogGroup"
            Resource:
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${CreateUrlsFunction}:*"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${CreateUrlsForApiFunction}:*"
          - Effect: Allow
            Action:
              - "logs:PutLogEvents"
            Resource:
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${CreateUrlsFunction}:log-stream:*"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${CreateUrlsForApiFunction}:log-stream:*"

  CreateUrlsForApiFunction:
    Type: 'AWS::Serverless::Function'
    Properties:
      CodeUri: ./src
      Handler: create_urls.api_handler
      Role: !GetAtt CreateUrlsRole.Arn
      SnapStart:
        "Fn::If":
        - SnapStartEnabled
        - "ApplyOn": "PublishedVersions"
        - !Ref "AWS::NoValue"
      Timeout: 5
      Environment:
        Variables:
          DISABLE_OUTPUT_PARAMETERS: {"Fn::If": [OutputParametersDisabled, "true", "false"]}
          DISABLE_POST_ACTIONS: {"Fn::If": [PostActionsDisabled, "true", "false"]}
          VERBOSE: {"Fn::If": [VerboseLoggingEnabled, "true", "false"]}
          KEY_ARN:
            "Fn::If":
              - EncryptionEnabled
              - "Fn::If":
                  - CreateKey
                  - !GetAtt EncryptionKey.Arn
                  - !Ref EncryptionKeyArn
              - !Ref AWS::NoValue

  CreateUrlsForApiFunctionVersion:
    Type: AWS::Lambda::Version
    Condition: SnapStartEnabled
    Properties:
      FunctionName: !Ref CreateUrlsForApiFunction

  CreateUrlsFunction:
    Type: 'AWS::Serverless::Function'
    Properties:
      CodeUri: ./src
      Handler: create_urls.direct_handler
      Role: !GetAtt CreateUrlsRole.Arn
      SnapStart:
        "Fn::If":
        - SnapStartEnabled
        - "ApplyOn": "PublishedVersions"
        - !Ref "AWS::NoValue"
      Timeout: 5
      Environment:
        Variables:
          DISABLE_OUTPUT_PARAMETERS: {"Fn::If": [OutputParametersDisabled, "true", "false"]}
          DISABLE_POST_ACTIONS: {"Fn::If": [PostActionsDisabled, "true", "false"]}
          VERBOSE: {"Fn::If": [VerboseLoggingEnabled, "true", "false"]}
          API_ID: !Ref Api
          STAGE: !Ref ApiStage
          KEY_ARN:
            "Fn::If":
              - EncryptionEnabled
              - "Fn::If":
                  - CreateKey
                  - !GetAtt EncryptionKey.Arn
                  - !Ref EncryptionKeyArn
              - !Ref AWS::NoValue

  CreateUrlsFunctionVersion:
    Type: AWS::Lambda::Version
    Condition: SnapStartEnabled
    Properties:
      FunctionName: !Ref CreateUrlsFunction

  CreateUrlsFunctionAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: live
      FunctionName: !Ref CreateUrlsFunction
      FunctionVersion: !If
        - SnapStartEnabled
        - !GetAtt CreateUrlsFunctionVersion.Version
        - "$LATEST"

  ProcessCallbackRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }

  ProcessCallbackSfnPolicy:
    Type: AWS::IAM::Policy
    Properties:
      Roles:
      - !Ref ProcessCallbackRole
      PolicyName: AccessSfn
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - "states:SendTaskSuccess"
              - "states:SendTaskFailure"
              - "states:SendTaskHeartbeat"
            Resource: "*"

  ProcessCallbackLogsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      Roles:
      - !Ref ProcessCallbackRole
      PolicyName: LambdaLogging
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - "logs:CreateLogStream"
              - "logs:CreateLogGroup"
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProcessCallbackFunction}:*"
          - Effect: Allow
            Action:
              - "logs:PutLogEvents"
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProcessCallbackFunction}:log-stream:*"

  ProcessCallbackFunction:
    Type: 'AWS::Serverless::Function'
    Properties:
      CodeUri: ./src
      Handler: process_callback.handler
      Role: !GetAtt ProcessCallbackRole.Arn
      SnapStart:
        "Fn::If":
        - SnapStartEnabled
        - "ApplyOn": "PublishedVersions"
        - !Ref "AWS::NoValue"
      Timeout: 15
      Environment:
        Variables:
          DISABLE_OUTPUT_PARAMETERS: {"Fn::If": [OutputParametersDisabled, "true", "false"]}
          DISABLE_POST_ACTIONS: {"Fn::If": [PostActionsDisabled, "true", "false"]}
          VERBOSE: {"Fn::If": [VerboseLoggingEnabled, "true", "false"]}
          KEY_ARN:
            "Fn::If":
              - EncryptionEnabled
              - "Fn::If":
                  - CreateKey
                  - !GetAtt EncryptionKey.Arn
                  - !Ref EncryptionKeyArn
              - !Ref AWS::NoValue

  ProcessCallbackFunctionVersion:
    Type: AWS::Lambda::Version
    Condition: SnapStartEnabled
    Properties:
      FunctionName: !Ref ProcessCallbackFunction

  # The following nonsense ensures the API stage gets the updated deployment
  # when the SnapStart option is toggled

  ApiDeployment1:
    Type: AWS::ApiGateway::Deployment
    Condition: SnapStartEnabled
    DependsOn:
      - CreateUrlsMethod
      - ProcessCallbackGetMethod
      - ProcessCallbackPostMethod
    Properties:
      RestApiId: !Ref Api

  ApiDeployment2:
    Type: AWS::ApiGateway::Deployment
    Condition: SnapStartNotEnabled
    DependsOn:
      - CreateUrlsMethod
      - ProcessCallbackGetMethod
      - ProcessCallbackPostMethod
    Properties:
      RestApiId: !Ref Api

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref Api
      StageName: v1
      DeploymentId:
        !If
          - SnapStartEnabled
          - !Ref ApiDeployment1
          - !Ref ApiDeployment2

  EncryptionKey:
    Type: AWS::KMS::Key
    Condition: CreateKey
    Properties:
      KeyPolicy: !Sub |
        {
          "Version": "2012-10-17",
          "Id": "key-default-1",
          "Statement": [{
            "Sid": "Enable IAM User Permissions",
            "Effect": "Allow",
            "Principal": {"AWS": "arn:aws:iam::${AWS::AccountId}:root"},
            "Action": "kms:*",
            "Resource": "*"
          }]
        }

  EncryptionKeyPolicy:
    Type: AWS::IAM::Policy
    Condition: EncryptionEnabled
    Properties:
      Roles:
      - !Ref CreateUrlsRole
      - !Ref ProcessCallbackRole
      PolicyName: AccessEncryptionKey
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - "kms:GenerateDataKey"
              - "kms:Decrypt"
            Resource:
              "Fn::If":
                - CreateKey
                - !GetAtt EncryptionKey.Arn
                - !Ref EncryptionKeyArn
